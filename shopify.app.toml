[webhooks]
api_version = "2025-10"
# 核心资源变更监控
[[webhooks.subscriptions]]
topics = [
  "app/uninstalled",
  "shop/update",
  "domains/create", "domains/update", "domains/destroy",
  "products/create", "products/update", "products/delete",
  "collections/create", "collections/update", "collections/delete",
  "inventory_items/create", "inventory_items/update", "inventory_items/delete",
  "locations/create", "locations/update", "locations/delete"
]
uri = "/api/webhooks"

# 订单与交易流程全链路监控
[[webhooks.subscriptions]]
topics = [
  "orders/create", "orders/updated", "orders/cancelled", "orders/fulfilled", "orders/paid",
  "orders/partially_fulfilled", "orders/delete", "orders/edited",
  "draft_orders/create", "draft_orders/update", "draft_orders/delete",
  "checkouts/create", "checkouts/update", "checkouts/delete",
  
  "refunds/create",
  "tender_transactions/create"
]
uri = "/api/webhooks"

[[webhooks.subscriptions]]
# 强制合规主题必须使用 compliance_topics 字段
compliance_topics = [
  "customers/redact",
  "shop/redact",
  "customers/data_request"
]
uri = "/api/webhooks" # 建议为合规性 Webhook 使用一个专用端点
